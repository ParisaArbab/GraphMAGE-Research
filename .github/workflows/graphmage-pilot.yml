name: GraphMAGE pilot tests and experiments

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      experiment:
        description: "Run one horizon, or compare all three horizons (1, 3, 7)"
        type: choice
        options: ["single_horizon", "multi_horizon"]
        default: "single_horizon"
      dataset:
        description: "Data source (Chicago requires network access)"
        type: choice
        options:
          - synthetic
          - chicago
        default: synthetic
      seeds:
        description: "Independent random seeds"
        type: choice
        options: ["2", "3", "5"]
        default: "3"
      epochs:
        description: "Training epochs per model"
        type: choice
        options: ["10", "20", "40"]
        default: "20"
      horizon:
        description: "Forecast horizon in weeks"
        type: choice
        options: ["1", "3", "7"]
        default: "3"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run automated tests
        run: python -m pytest -q tests

  pilot:
    if: (github.event_name == 'workflow_dispatch' && inputs.experiment != 'multi_horizon') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-chicago-pilot]'))
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run six-model ablation
        env:
          MPLBACKEND: Agg
        run: |
          mkdir -p results/ci-pilot
          set -o pipefail
          python agent.py \
            --data "${{ github.event_name == 'workflow_dispatch' && inputs.dataset || 'chicago' }}" \
            --max-traps 48 \
            --horizon "${{ github.event_name == 'workflow_dispatch' && inputs.horizon || '3' }}" \
            --epochs "${{ github.event_name == 'workflow_dispatch' && inputs.epochs || '20' }}" \
            --seeds "${{ github.event_name == 'workflow_dispatch' && inputs.seeds || '3' }}" \
            --out "results/ci-pilot" 2>&1 | tee results/ci-pilot/run.log
      - name: Upload experiment report and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphmage-pilot-results
          path: results/ci-pilot/
          if-no-files-found: warn

  multi_horizon:
    if: (github.event_name == 'workflow_dispatch' && inputs.experiment == 'multi_horizon') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-multihorizon]'))
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run 5-seed, 3-horizon Chicago experiment
        env:
          MPLBACKEND: Agg
        run: |
          mkdir -p results/multihorizon-chicago
          set -o pipefail
          python scripts/run_multihorizon.py \
            --data chicago \
            --max-traps 48 \
            --seeds 5 \
            --epochs 20 \
            --horizons 1 3 7 \
            --out results/multihorizon-chicago 2>&1 | tee results/multihorizon-chicago/run.log
      - name: Upload results, all seed runs, and paired analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphmage-multihorizon-results
          path: results/multihorizon-chicago/
          if-no-files-found: warn
